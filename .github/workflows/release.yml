name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    # Native arm64: the package is Architecture: arm64 and dh_shlibdeps has to
    # resolve libasound.so.2 against real arm64 libraries, so this cannot be
    # cross-built on an x86 runner.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends devscripts equivs
          sudo mk-build-deps -i -r -t 'apt-get -y --no-install-recommends'

      - name: Check the tag matches debian/changelog
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          changelog=$(dpkg-parsechangelog -S Version)
          tag=${GITHUB_REF_NAME#v}
          if [ "$changelog" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME says $tag, debian/changelog says $changelog" >&2
            exit 1
          fi

      - name: Build
        run: dpkg-buildpackage -us -uc -b

      # dpkg-buildpackage writes to the parent directory, which is outside the
      # workspace and so out of reach of upload-artifact and the release step.
      - name: Collect the artefacts
        run: |
          mkdir -p dist
          mv ../*.deb ../*.buildinfo ../*.changes dist/
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.deb --clobber
